<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eventos UY - Template</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

  <body class="d-flex flex-column min-vh-100">

        </h1>

        <div style="margin-bottom: 0.5rem">
          <h3 class="text-white bg-primary p-1 fs-5">Operaciones</h3>
          <a
            href="#"
            class="d-block px-1 text-primary"

          <a
            href="#"
            class="d-block px-1 text-primary"
            style="font-size: 0.875rem"

          <a

        <div style="margin-bottom: 0.5rem">
          <h3 class="text-white bg-primary p-1 fs-5">Categorías</h3>
          <a
            href="#"
            class="d-block px-1 text-primary"
            style="font-size: 0.875rem"
            >Tecnología</a
          >
          <a
            href="#"
            class="d-block px-1 text-primary"
            style="font-size: 0.875rem"
            >Innovación</a
          >
          <a
            href="#"
            class="d-block px-1 text-primary"
            style="font-size: 0.875rem"
            >Deporte</a
          >
          <a
            href="#"
            class="d-block px-1 text-primary"
            style="font-size: 0.875rem"
            >Salud</a
          >
        </div>
      </nav>
    </div>

    <footer
      class="bg-primary text-white d-flex justify-content-between align-items-center p-2 p-sm-3 mt-auto"
    >
      <p class="fw-bold m-0">TPROG 2025</p>
      <p class="m-0">Grupo 24</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</html>
