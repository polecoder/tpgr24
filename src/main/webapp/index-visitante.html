<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eventos UY</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }

      a:hover {
        text-decoration: underline;
        color: #0d6efd;
      }

      .section-title {
        font-size: 1rem;
        font-weight: 600;
        color: #0d6efd;
        border-bottom: 1px solid #dee2e6;
        padding-bottom: 0.5rem;
        margin-bottom: 1rem;
      }

      .card-img-top.placeholder {
        background-color: #f8f9fa;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #6c757d;
        font-size: 0.9rem;
        height: 200px;
      }
    </style>
  </head>

  <body class="d-flex flex-column min-vh-100 bg-light">
    <!-- Barra de navegación -->
    <nav class="d-flex justify-content-between bg-primary p-3 shadow-sm">
      <a href="./index-visitante.html" class="fw-bold text-white text-decoration-none fs-4">
        eventos.uy
      </a>
      <ul class="list-unstyled m-0">
        <li>
          <a
            href="./pages/inicio-sesion.html"
            class="text-white text-uppercase text-decoration-underline small"
            >Iniciar sesión</a
          >
        </li>
      </ul>
    </nav>

    <!-- Contenido principal -->
    <div class="container flex-grow-1 mt-4">
      <div class="row g-4">
        <!-- Menú lateral (versión original restaurada) -->
        <div class="col-12 col-md-4">
          <nav class="border border-primary rounded p-3 bg-white shadow-sm">
            <!-- Usuarios -->
            <div class="mb-4">
              <h5 class="text-white bg-primary p-2 rounded">Usuarios</h5>
              <div class="d-flex align-items-center mb-3">
                <img
                  src="./images/IMG-US01.jpg"
                  alt="Ana Torres"
                  class="rounded-circle me-2"
                  style="width: 48px; height: 48px"
                />
                <a
                  href="./pages/consulta-usuario-ana-torres-visitante.html"
                  class="text-primary fw-semibold"
                  >Ana Torres</a
                >
              </div>
              <div class="d-flex align-items-center">
                <img
                  src="./images/IMG-US04.jpeg"
                  alt="MisEventos"
                  class="rounded-circle me-2"
                  style="width: 48px; height: 48px"
                />
                <a
                  href="./pages/consulta-usuario-ana-torres-visitante.html"
                  class="text-primary fw-semibold"
                  >MisEventos</a
                >
              </div>
            </div>

            <!-- Categorías -->
            <div>
              <h5 class="text-white bg-primary p-2 rounded">Categorías</h5>
              <ul class="list-unstyled ps-2">
                <li>
                  <a href="#" class="text-primary small d-block mb-2"
                    >Tecnología</a
                  >
                </li>
                <li>
                  <a href="#" class="text-primary small d-block mb-2"
                    >Innovación</a
                  >
                </li>
                <li>
                  <a href="#" class="text-primary small d-block mb-2"
                    >Deporte</a
                  >
                </li>
                <li>
                  <a href="#" class="text-primary small d-block">Salud</a>
                </li>
              </ul>
            </div>
          </nav>
        </div>

        <!-- Eventos disponibles -->
        <div class="col-12 col-md-8 order-1 order-md-2 justify-content-center">
          <h1 class="text-center text-uppercase py-3 fs-2">
            Eventos disponibles
          </h1>
          <div class="row row-cols-1 row-cols-md-2 g-4 justify-content-center">
            <!-- Tarjeta: Conferencia de Tecnología -->
            <div class="col" style="width: 350px">
              <div class="card h-100 shadow-sm">
                <a
                  href="./pages/consulta-evento-maraton-montevideo-visitante.html"
                >
                  <img
                    src="./images/sin-imagen.svg"
                    alt="Conferencia de Tecnología"
                    class="card-img-top"
                    style="object-fit: cover"
                  />
                </a>
                <div class="card-body text-center">
                  <a
                    href="./pages/consulta-evento-maraton-montevideo-visitante.html"
                    class="card-title fs-6 text-decoration-none text-dark fw-semibold"
                    >Conferencia de Tecnología</a
                  >
                </div>
              </div>
            </div>

            <!-- Tarjeta: Maratón de Montevideo -->
            <div class="col" style="width: 350px">
              <div class="card h-100 shadow-sm">
                <a
                  href="./pages/consulta-evento-maraton-montevideo-visitante.html"
                >
                  <img
                    src="./images/IMG-EV04.png"
                    alt="Maratón de Montevideo"
                    class="card-img-top"
                    style="object-fit: cover"
                  />
                </a>
                <div class="card-body text-center">
                  <a
                    href="./pages/consulta-evento-maraton-montevideo-visitante.html"
                    class="card-title fs-6 text-decoration-none text-dark fw-semibold"
                    >Maratón de Montevideo</a
                  >
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Pie de página -->
    <footer
      class="bg-primary text-white d-flex justify-content-between align-items-center p-3 mt-auto shadow-sm"
    >
      <p class="fw-bold m-0">TPROG 2025</p>
      <p class="m-0">Grupo 24</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
