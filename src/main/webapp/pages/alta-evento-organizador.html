<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eventos UY - Alta de Evento</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <nav class="d-flex justify-content-between bg-primary p-2 p-sm-3">
      <a
        href="#"
        class="fw-bold text-white text-decoration-none fs-5 fs-sm-4"
        style="line-height: 48px"
      >
        eventos.uy
      </a>
      <ul class="list-unstyled m-0 d-flex gap-3">
        <li class="d-flex gap-3">
          <img
            src="../images/IMG-US04.jpeg"
            alt="Imagen usuario"
            style="width: 48px; height: 48px"
          />
          <a href="#" class="text-white m-0" style="line-height: 48px"
            >MisEventos</a
          >
        </li>
        <li class="text-uppercase text-white" style="line-height: 48px">
          <a href="#" class="text-white">Cerrar Sesión</a>
        </li>
      </ul>
    </nav>

    <div class="container flex-grow-1" style="width: 900px">
      <div class="mx-auto">
        <h1 class="text-center text-uppercase py-4 fs-2 fs-sm-3">
          Alta de evento
        </h1>
      </div>

      <div class="d-flex mx-auto justify-content-between">
        <nav
          class="border-primary border rounded"
          style="width: 200px; height: fit-content"
        >
          <div style="margin-bottom: 0.5rem">
            <h3 class="text-white bg-primary p-1 fs-5">Categorías</h3>
            <a
              href="#"
              class="d-block px-1 text-primary"
              style="font-size: 0.875rem"
              >Deporte</a
            >
            <a
              href="#"
              class="d-block px-1 text-primary"
              style="font-size: 0.875rem"
              >Salud</a
            >
            <a
              href="#"
              class="d-block px-1 text-primary"
              style="font-size: 0.875rem"
              >Tecnología</a
            >
            <a
              href="#"
              class="d-block px-1 text-primary"
              style="font-size: 0.875rem"
              >Innovación</a
            >
          </div>
        </nav>

        <main class="p-4 bg-light border-top border-2 border-primary rounded">
          <div id="alert-area" class="mb-3"></div>
          <form
            id="altaEventoForm"
            method="post"
            action="../alta-evento"
            enctype="multipart/form-data"
            novalidate
            class="d-flex flex-column gap-4"
          >
            <div class="d-flex justify-content-center gap-3 align-items-center">
              <label
                for="nombre"
                class="form-label text-end"
                style="width: 155px"
                >Nombre:</label
              >
              <input
                type="text"
                id="nombre"
                name="nombre"
                class="form-control form-control-sm"
                style="width: 300px"
                required
              />
            </div>

            <div class="d-flex justify-content-center gap-3 align-items-center">
              <label
                for="descripcion"
                class="form-label text-end"
                style="width: 155px"
                >Descripcion:</label
              >
              <textarea
                id="descripcion"
                name="descripcion"
                rows="3"
                class="form-control form-control-sm"
                style="width: 300px"
                required
              >
              </textarea>
            </div>

            <div class="d-flex justify-content-center gap-3 align-items-center">
              <label
                for="sigla"
                class="form-label text-end"
                style="width: 155px"
                >Sigla:</label
              >
              <input
                type="text"
                id="sigla"
                name="sigla"
                class="form-control form-control-sm"
                style="width: 300px"
              />
            </div>

            <div
              class="d-flex align-items-center justify-content-center gap-3 align-items-center"
            >
              <label class="form-label text-end" style="width: 155px"
                >Categorías:</label
              >
              <div style="width: 300px">
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="cat1"
                    name="categorias"
                    value="Deporte"
                  />
                  <label class="form-check-label" for="cat1">Deporte</label>
                </div>
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="cat2"
                    name="categorias"
                    value="Salud"
                  />
                  <label class="form-check-label" for="cat2">Salud</label>
                </div>
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="cat3"
                    name="categorias"
                    value="Tecnología"
                  />
                  <label class="form-check-label" for="cat3">Tecnología</label>
                </div>
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="cat4"
                    name="categorias"
                    value="Innovación"
                  />
                  <label class="form-check-label" for="cat4">Innovación</label>
                </div>
              </div>
            </div>

            <div class="d-flex justify-content-center gap-3 align-items-center">
              <label
                for="imagen"
                class="form-label text-end"
                style="width: 155px"
                >Imagen:</label
              >
              <input
                type="file"
                id="imagen"
                name="imagen"
                accept="image/*"
                class="form-control form-control-sm"
                style="width: 300px"
              />
            </div>

            <div class="d-flex justify-content-center gap-3 align-items-center">
              <button type="submit" class="btn btn-primary btn-sm px-3">
                Aceptar
              </button>
              <button type="reset" class="btn btn-primary btn-sm px-3">
                Reset
              </button>
            </div>
          </form>
        </main>
      </div>
    </div>

    <footer
      class="bg-primary text-white d-flex justify-content-between align-items-center p-2 p-sm-3 mt-auto"
    >
      <p class="fw-bold m-0">TPROG 2025</p>
      <p class="m-0">Grupo 24</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/alta-evento.js"></script>
  </body>
</html>
