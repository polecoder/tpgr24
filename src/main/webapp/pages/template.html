<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eventos UY - Template</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <nav class="d-flex justify-content-between bg-primary p-2 p-sm-3">
      <a
        href="../index.html"
        class="fw-bold text-white text-decoration-none fs-5 fs-sm-4"
      >
        eventos.uy
      </a>
      <ul class="list-unstyled m-0">
        <li>
          <a
            href="./inicio-sesion.html"
            class="text-white text-uppercase text-decoration-underline small"
            >Iniciar sesión</a
          >
        </li>
      </ul>
    </nav>

    <div class="container flex-grow-1">
      <div class="mx-auto" style="max-width: 768px">
        <h1 class="text-center text-uppercase py-4 fs-2 fs-sm-3">
          Template para las páginas de caso de uso
        </h1>
      </div>

      <main
        class="mx-auto p-4 bg-light border-top border-2 border-primary rounded"
        style="max-width: 375px"
      >
        <form class="d-flex flex-column gap-4">
          <div class="d-flex justify-content-center gap-3">
            <label for="campo1" class="form-label text-end" style="width: 80px"
              >Campo 1:</label
            >
            <input
              type="text"
              id="campo1"
              name="Campo1"
              class="form-control form-control-sm"
              style="max-width: 200px"
            />
          </div>

          <div class="d-flex justify-content-center gap-3">
            <label for="campo2" class="form-label text-end" style="width: 80px"
              >Campo 2:</label
            >
            <input
              type="text"
              id="campo2"
              name="Campo2"
              class="form-control form-control-sm"
              style="max-width: 200px"
            />
          </div>

          <div class="d-flex justify-content-center gap-3">
            <label for="campo3" class="form-label text-end" style="width: 80px"
              >Campo 3:</label
            >
            <input
              type="text"
              id="campo3"
              name="Campo3"
              class="form-control form-control-sm"
              style="max-width: 200px"
            />
          </div>

          <div class="d-flex justify-content-center gap-3">
            <button type="button" class="btn btn-primary btn-sm px-3">
              Aceptar
            </button>
            <button type="button" class="btn btn-primary btn-sm px-3">
              Cancelar
            </button>
            <button  type="reset" class="btn btn-primary btn-sm px-3">
              Reset
            </button>
          </div>
        </form>
      </main>
    </div>

    <footer
      class="bg-primary text-white d-flex justify-content-between align-items-center p-2 p-sm-3 mt-auto"
    >
      <p class="fw-bold m-0">TPROG 2025</p>
      <p class="m-0">Grupo 24</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
