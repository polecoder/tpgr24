<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eventos UY - Consulta Edición</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <nav class="d-flex justify-content-between bg-primary p-2 p-sm-3">
      <a
        href="../index.html"
        class="fw-bold text-white text-decoration-none fs-5 fs-sm-4"
      >
        eventos.uy
      </a>
      <ul class="list-unstyled m-0">
        <li>
          <a
            href="./inicio-sesion.html"
            class="text-white text-uppercase text-decoration-underline small"
            >Iniciar sesión</a
          >
        </li>
      </ul>
    </nav>

    <div class="container flex-grow-1">
      <div class="mx-auto" style="max-width: 780px">
        <h1 class="text-center text-uppercase py-4 fs-2 fs-sm-3">
          Consulta de edición de evento
        </h1>
      </div>

      <main
        class="mx-auto p-4 bg-light border-top border-2 border-primary rounded"
        style="max-width: 500px"
      >
        <form class="d-flex flex-column gap-4">
           <div class="d-flex align-items-center gap-3" style="margin-left: -17.5px">
            <label for="evento" class="form-label text-end" style="width: 80px">
              Evento:
            </label>
            <select id="evento" name="evento" class="form-select form-select-sm" style="width: fit-content; min-width: 200px">
				  <option value="" selected>-- Selecciona un evento --</option>
				  <option value="Montevideo Rock">Montevideo Rock</option>
				  <option value="Maratón de Montevideo">Maratón de Montevideo</option>
				  <option value="Montevideo Comics">Montevideo Comics</option>
				  <option value="Expointer Uruguay">Expointer Uruguay</option>
            </select>
          </div>

          <div class="d-flex align-items-center gap-3" style="margin-left: -17.5px">
            <label for="edicion" class="form-label text-end" style="width: 80px">
              Edición:
            </label>
            <select id="edicion" name="edicion" class="form-select form-select-sm" style="width: fit-content; min-width: 200px">
              <option value=""selected>-- Selecciona una edición --</option>
            </select>
          </div>
			
		  <div id="info-edicion" class="mt-2 p-3 border rounded bg-white d-block mx-auto" style="height: fit-content ; width: fit-content ;min-width: 450px;display: none;">
   		 			<!-- Acá se muestra la info -->
  		  </div>
		  
         <div class="d-flex justify-content-center gap-3">
    		<button id="btnAceptar" type="button" class="btn btn-primary btn-sm px-3">Aceptar</button>
    		<button id="btnCancelar" type="button" class="btn btn-primary btn-sm px-3">Cancelar</button>
  		</div>
        </form>
      </main>
    </div>

    <footer
      class="bg-primary text-white d-flex justify-content-between align-items-center p-2 p-sm-3 mt-auto"
    >
      <p class="fw-bold m-0">TPROG 2025</p>
      <p class="m-0">Grupo 24</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
   <script src="../js/edicion-evento.js"></script>
  </body>
</html>
