<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eventos UY - Alta Edición Evento</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <nav class="d-flex justify-content-between bg-primary p-2 p-sm-3">
      <a
        href="#"
        class="fw-bold text-white text-decoration-none fs-5 fs-sm-4"
        style="line-height: 48px"
      >
        eventos.uy
      </a>
      <ul class="list-unstyled m-0 d-flex gap-3">
        <li class="d-flex gap-3">
          <img
            src="../images/IMG-US04.jpeg"
            alt="Imagen usuario"
            style="width: 48px; height: 48px"
          />
          <a href="#" class="text-white m-0" style="line-height: 48px"
            >MisEventos</a
          >
        </li>
        <li class="text-uppercase text-white" style="line-height: 48px">
          <a href="#" class="text-white">Cerrar Sesión</a>
        </li>
      </ul>
    </nav>

    <div class="container mx-auto" style="width: 900px">
      <div class="mx-auto" style="max-width: 800px">
        <h1 class="text-center text-uppercase py-4 fs-2 fs-sm-3">
          Alta Edición de Evento
        </h1>
      </div>

      <div class="d-flex justify-content-between gap-5">
        <nav
          class="border-primary border rounded"
          style="width: 200px; height: fit-content"
        >
          <div style="margin-bottom: 0.5rem">
            <h3 class="text-white bg-primary p-1 fs-5">Categorías</h3>
            <a
              href="#"
              class="d-block px-1 text-primary"
              style="font-size: 0.875rem"
              >Deporte</a
            >
            <a
              href="#"
              class="d-block px-1 text-primary"
              style="font-size: 0.875rem"
              >Salud</a
            >
          </div>
        </nav>

        <main
          class="p-4 bg-light border-top border-2 border-primary rounded"
          style="max-width: 768px"
        >
          <form class="d-flex flex-column gap-4">
            <div class="row mb-3">
              <img
                class="col-4"
                src="../images/IMG-EV04.png"
                alt="Imagen evento"
                style="
                  width: auto;
                  height: auto;
                  max-width: 100px;
                  max-height: 100px;
                "
              />
              <h2
                for="evento"
                class="col-8 col-form-label fs-3 fw-bold text-nowrap"
                style="max-width: 180px"
              >
                Maratón de Montevideo
              </h2>
            </div>

            <div class="d-flex mb-2">
              <label
                for="nombreEdicion"
                class="form-label text-nowrap"
                style="width: 155px"
                >Nombre de edición:<span class="text-danger">*</span></label
              >
              <input
                type="text"
                id="nombreEdicion"
                class="form-control form-control-sm"
                style="width: 350px"
              />
            </div>

            <div class="d-flex mb-2">
              <label for="SiglaEdicion" class="form-label" style="width: 155px"
                >Sigla:<span class="text-danger">*</span></label
              >
              <input
                type="text"
                id="SiglaEdicion"
                class="form-control form-control-sm"
                style="max-width: 350px"
              />
            </div>

            <div class="d-flex mb-2">
              <label for="PaisEdcion" class="form-label" style="width: 155px"
                >Pais:<span class="text-danger">*</span></label
              >
              <input
                type="text"
                id="PaisEdicion"
                class="form-control form-control-sm"
                style="max-width: 350px"
              />
            </div>

            <div class="d-flex mb-2">
              <label for="ciudadEdcion" class="form-label" style="width: 155px"
                >Ciudad:<span class="text-danger">*</span></label
              >
              <input
                type="text"
                id="ciudadEdicion"
                class="form-control form-control-sm"
                style="max-width: 350px"
              />
            </div>

            <div class="d-flex align-items-center">
              <label for="fechaInicio" style="height: fit-content; width: 155px"
                >Fecha de inicio:<span class="text-danger">*</span></label
              >
              <input
                type="date"
                id="fechaInicio"
                name="fechaInicio"
                class="form-control"
                style="max-width: 350px"
                required
              />
            </div>

            <div class="d-flex align-items-center">
              <label for="fechaFin" style="height: fit-content; width: 155px"
                >Fecha de fin:<span class="text-danger">*</span></label
              >
              <input
                type="date"
                id="fechaFin"
                name="fechaFin"
                class="form-control"
                style="max-width: 350px"
                required
              />
            </div>

            <div class="d-flex mb-2">
              <label for="foto" class="form-label" style="width: 155px"
                >Imágen:</label
              >
              <input
                type="file"
                id="foto"
                name="foto"
                class="form-control form-control-sm"
                style="max-width: 350px"
                accept="image/*"
              />
              <img
                id="previewFoto"
                style="display: none; max-width: 100%; margin-top: 10px"
              />
            </div>

            <div class="d-flex justify-content-end gap-2 mb-2">
              <button
                type="button"
                id="btnEvento"
                class="btn btn-primary btn-sm px-3"
                style="max-width: 155px"
              >
                Volver a evento
              </button>
              <button
                type="button"
                id="btnAceptar"
                class="btn btn-primary btn-sm px-3"
                style="max-width: 155px"
              >
                Crear edición
              </button>
            </div>
          </form>
        </main>
      </div>
    </div>

    <footer
      class="bg-primary text-white d-flex justify-content-between align-items-center p-2 p-sm-3 mt-auto"
    >
      <p class="fw-bold m-0">TPROG 2025</p>
      <p class="m-0">Grupo 24</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/alta-edicion.js"></script>
  </body>
</html>
