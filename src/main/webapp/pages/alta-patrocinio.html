<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eventos UY - Template</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <nav class="d-flex justify-content-between bg-primary p-2 p-sm-3">
      <a
        href="../index.html"
        class="fw-bold text-white text-decoration-none fs-5 fs-sm-4"
      >
        eventos.uy
      </a>
      <ul class="list-unstyled m-0">
        <li>
          <a
            href="./inicio-sesion.html"
            class="text-white text-uppercase text-decoration-underline small"
            >Iniciar sesión</a
          >
        </li>
      </ul>
    </nav>

    <div class="container flex-grow-1">
      <div class="mx-auto" style="max-width: 768px">
        <h1 class="text-center text-uppercase py-4 fs-2 fs-sm-3">
          Alta Patrocinio
        </h1>
      </div>

      <main
        class="mx-auto p-4 bg-light border-top border-2 border-primary rounded"
        style="width: 430px"
      >

        <form class="d-flex flex-column gap-2">
          <!-- Evento y Edición -->
            <div class="d-flex flex-column mb-2">
              <label for="evento" class="form-label " style="width: 200px">Evento: <span class="text-danger">*</span></label>
              <select id="evento" name="evento" class="form-select form-select-sm" style="max-width: 300px">
                <option value="" selected>-- Seleccionar un Evento --</option>
                <option value="Montevideo Rock">Montevideo Rock</option>
                <option value="Maratón de Montevideo">Maratón de Montevideo</option>
                <option value="Montevideo Comics">Montevideo Comics</option>
                <option value="Expointer Uruguay">Expointer Uruguay</option>
              </select>
            </div>

            <div class="d-flex flex-column gap-2">
              <label for="edicion" class="form-label" style="width: 200px">Edición: <span class="text-danger">*</span></label>
              <select id="edicion" name="edicion" class="form-select form-select-sm" style="max-width: 300px">
                <option value="" selected>-- Seleccionar una Edición --</option>
              </select>
            </div>
    
          <!-- Tipo de Registro -->
			<div class="d-flex flex-column gap-2">
			  <label for="tipoRegistro" class="form-label" style="width: 200px">
			    Tipo de Registro: <span class="text-danger">*</span>
			  </label>
			  <select id="tipoRegistro" name="TipoRegistro" class="form-select form-select-sm" style="max-width: 300px" disabled>
			    <option value="" selected>-- Seleccionar un Tipo Registro --</option>
			     
			  </select>
			</div>

          <!-- Instituciones -->
          <div class="d-flex flex-column gap-2">
            <label for="instituciones" class="form-label " style="width: 200px">Instituciones: <span class="text-danger">*</span></label>
            <select id="instituciones" name="Instituciones" class="form-select form-select-sm" style="max-width: 300px">
              <option value="" selected>-- Seleccionar una Institución --</option>
               <option value="inst">intituvion1</option>
            </select>
          </div>

          <!-- Nivel de Patrocinio -->
          <div class="d-flex flex-column gap-2">
            <label for="nivelPatrocinio" class="form-label " style="width: 200px">Nivel de Patrocinio: <span class="text-danger">*</span></label>
            <select id="nivelPatrocinio" name="Nivel" class="form-select form-select-sm" style="max-width: 300px">
              <option value="" selected>-- Seleccionar Nivel del Patrocinio --</option>
              <option value="Platino">Platino</option>
              <option value="Oro">Oro</option>
              <option value="Plata">Plata</option>
              <option value="Bronce">Bronce</option>
            </select>
          </div>

          <!-- Aporte Económico -->
          <div class="d-flex flex-column gap-2">
            <label for="aporteEconomico" class="form-label" style="width: 200px">Aporte Económico: <span class="text-danger">*</span></label>
            <input type="text" id="aporte" name="Aporte" class="form-control form-control-sm" style="max-width: 300px" />
          </div>

          <!-- Cupos Gratuitos -->
          <div class="d-flex flex-column gap-2">
            <label for="cuposGratuitos" class="form-label" style="width: 200px">Cant. cupos Gratuitos: <span class="text-danger">*</span></label>
            <input type="text" id="cupos" name="Cupos" class="form-control form-control-sm" style="max-width: 300px" />
          </div>

          <!-- Código Patrocinio -->
          <div class="d-flex flex-column gap-2">
            <label for="codigoPatrocinio" class="form-label" style="width: 200px">Código Patrocinio: <span class="text-danger">*</span></label>
            <input type="text" id="codigo" name="Codigo" class="form-control form-control-sm" style="max-width: 300px" />
          </div>

          <!-- Botones -->
          <div class="d-flex flex-column gap-2">
            <button type="button" id="btnAceptar" class="btn btn-primary btn-sm px-3">Aceptar</button>
          </div>
        </form>
      </main>
    </div>

    <footer class="bg-primary text-white d-flex justify-content-between align-items-center p-2 p-sm-3 mt-auto">
      <p class="fw-bold m-0">TPROG 2025</p>
      <p class="m-0">Grupo 24</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/alta-patrocinio.js"></script>
  </body>
</html>
