<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eventos UY - Template</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <nav class="d-flex justify-content-between bg-primary p-2 p-sm-3">
      <a
        href="../index.html"
        class="fw-bold text-white text-decoration-none fs-5 fs-sm-4"
      >
        eventos.uy
      </a>
      <ul class="list-unstyled m-0">
        <li>
          <a
            href="./inicio-sesion.html"
            class="text-white text-uppercase text-decoration-underline small"
            >Iniciar sesión</a
          >
        </li>
      </ul>
    </nav>

    <div class="container flex-grow-1">
      <div class="mx-auto" style="max-width: 768px">
        <h1 class="text-center text-uppercase py-4 fs-2 fs-sm-3">
          Alta de Tipo de Registro 
        </h1>
      </div>

      <main
        class="mx-auto p-4 bg-light border-top border-2 border-primary rounded"
        style="max-width: 375px"
      >
        <form class="d-flex flex-column gap-4">
           <div class="d-flex flex-column gap-2">
            <label for="evento" class="form-label" style="width: 80px">
              Ediciones:
            </label>
            <select id="ediciones" name="ediciones" class="form-select form-select-sm" style="width: 300px">
				  <option value=""selected>-- Selecciona una edición --</option>
            </select>
          </div>

          <div class="d-flex flex-column gap-2">
            <label for="nombre" class="form-label" style="width: 200px">Nombre: <span class="text-danger">*</span></label>
            <input type="text" id="Nombre" class="form-control form-control-sm" style="max-width: 300px" />
          </div>

          <div class="d-flex flex-column gap-2">
            <label for="descripcion" class="form-label" style="width: 200px">Descripción: <span class="text-danger">*</span></label>
            <input type="text" id="Descripcion" class="form-control form-control-sm" style="max-width: 300px" />
          </div>

          <div class="d-flex flex-column gap-2">
            <label for="costo" class="form-label" style="width: 200px">Costo: <span class="text-danger">*</span></label>
            <input type="text" id="Costo" class="form-control form-control-sm" style="max-width: 300px" />
          </div>
          
          <div class="d-flex flex-column gap-2">
            <label for="cupos" class="form-label" style="width: 200px">Cant. Cupos: <span class="text-danger">*</span></label>
            <input type="text" id="Cupos" class="form-control form-control-sm" style="max-width: 300px" />
          </div>

          <div class="d-flex justify-content-center gap-3">
            <button type="button"id="btnAceptar" class="btn btn-primary btn-sm px-3">
              Aceptar
            </button>
          </div>
        </form>
      </main>
    </div>

    <footer
      class="bg-primary text-white d-flex justify-content-between align-items-center p-2 p-sm-3 mt-auto"
    >
      <p class="fw-bold m-0">TPROG 2025</p>
      <p class="m-0">Grupo 24</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
     <script src="../js/alta-tipo-registro.js"></script>
  </body>
</html>
