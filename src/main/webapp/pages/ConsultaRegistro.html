<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eventos UY - Consulta de Registro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body class="d-flex flex-column min-vh-100">
  <nav class="d-flex justify-content-between bg-primary p-2 p-sm-3">
    <a href="../index.html" class="fw-bold text-white text-decoration-none fs-5 fs-sm-4">eventos.uy</a>
    <ul class="list-unstyled m-0">
      <li>
        <a href="./inicio-sesion.html" class="text-white text-uppercase text-decoration-underline small">
          Iniciar sesión
        </a>
      </li>
    </ul>
  </nav>

  <div class="container flex-grow-1">
    <div class="mx-auto" style="max-width: 768px">
      <h1 class="text-center text-uppercase py-4 fs-2 fs-sm-3">
        Consulta de Registro
      </h1>
    </div>

    <main class="mx-auto p-4 bg-light border-top border-2 border-primary rounded" style="max-width: 500px">
      <form class="d-flex flex-column gap-3">
        <!-- Selección de usuario -->
        <div class="d-flex justify-content-between align-items-center">
          <label for="selectUsuario" class="form-label mb-0" style="width: 100px">Usuario:</label>
          <select id="selectUsuario" class="form-select form-select-sm" style="max-width: 300px">
            <option selected disabled>-- Seleccionar un Usuario --</option>
            <!-- Options a insertar dinámicamente -->
          </select>
        </div>

        <!-- Selección de registro -->
        <div class="d-flex justify-content-between align-items-center">
          <label for="selectRegistro" class="form-label mb-0" style="width: 100px">Registro:</label>
          <select id="selectRegistro" class="form-select form-select-sm" style="max-width: 300px" disabled>
            <!-- Options a insertar dinámicamente -->
          </select>
        </div>

        <!-- Botón Ver Detalle -->
        <div class="d-flex justify-content-end">
          <button type="button" id="btnDetalle" class="btn btn-primary btn-sm" disabled>
            Ver Detalle
          </button>
        </div>

        <!-- Área de texto para el detalle -->
        <div>
          <label for="detalle" class="form-label">Detalle:</label>
          <textarea id="detalle" class="form-control form-control-sm" rows="6" readonly
            style="font-family: monospace"></textarea>
        </div>
      </form>
    </main>
  </div>

  <footer class="bg-primary text-white d-flex justify-content-between align-items-center p-2 p-sm-3 mt-auto">
    <p class="fw-bold m-0">TPROG 2025</p>
    <p class="m-0">Grupo 24</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Opcional: aquí iría la lógica JS para cargar datos y manejar eventos -->
  <script src="../js/ConsultaRegistro.js"></script>
</body>

</html>
