<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eventos UY - Consulta de Registro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body class="d-flex flex-column min-vh-100">
  <nav class="d-flex justify-content-between bg-primary p-2 p-sm-3">
    <a href="../index.html" class="fw-bold text-white text-decoration-none fs-5 fs-sm-4">eventos.uy</a>
    <ul class="list-unstyled m-0">
      <li>
        <a href="./inicio-sesion.html" class="text-white text-uppercase text-decoration-underline small">
          Iniciar sesión
        </a>
      </li>
    </ul>
  </nav>

  <div class="container flex-grow-1">
    <div class="mx-auto" style="max-width: 768px">
      <h1 class="text-center text-uppercase py-4 fs-2 fs-sm-3">
        Consulta de Registro
      </h1>
    </div>

    <main class="mx-auto p-4 bg-light border-top border-2 border-primary rounded" style="max-width: 500px">
      <form class="d-flex flex-column gap-3">
        <!-- Selección de usuario -->
        <div class="d-flex justify-content-between align-items-center">
          <label for="selectUsuario" class="form-label mb-0" style="width: 100px">Usuario:</label>
          <select id="selectUsuario" class="form-select form-select-sm" style="max-width: 300px">
            <option selected disabled>-- Seleccionar un Usuario --</option>
            <!-- Options a insertar dinámicamente -->
          </select>
        </div>

        <!-- Selección de registro -->
        <div class="d-flex justify-content-between align-items-center">
          <label for="selectRegistro" class="form-label mb-0" style="width: 100px">Registro:</label>
          <select id="selectRegistro" class="form-select form-select-sm" style="max-width: 300px" disabled>
            <!-- Options a insertar dinámicamente -->
          </select>
        </div>

        <!-- Botón Ver Detalle -->
        <div class="d-flex justify-content-end">
          <button type="button" id="btnDetalle" class="btn btn-primary btn-sm" disabled>
            Ver Detalle
          </button>
        </div>

        <!-- Área de texto para el detalle -->
        <div>
          <label for="detalle" class="form-label">Detalle:</label>
          <textarea id="detalle" class="form-control form-control-sm" rows="6" readonly
            style="font-family: monospace"></textarea>
        </div>
      </form>
    </main>
  </div>

  <footer class="bg-primary text-white d-flex justify-content-between align-items-center p-2 p-sm-3 mt-auto">
    <p class="fw-bold m-0">TPROG 2025</p>
    <p class="m-0">Grupo 24</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Opcional: aquí iría la lógica JS para cargar datos y manejar eventos -->
  <script>
    // Simulación de datos y eventos
    const usuarios = ['ana', 'bruno', 'carla'];
    const registrosPorUsuario = {
      'ana': ['Edición A', 'Edición B'],
      'bruno': [],
      'carla': ['Edición C']
    };

    const detalles = {
      'ana|Edición A': `Edición: Edición A\nUsuario: ana\nTipo: General\nFecha: 01/01/2025\nCosto: $100`,
      'ana|Edición B': `Edición: Edición B\nUsuario: ana\nTipo: VIP\nFecha: 03/02/2025\nCosto: $250`,
      'carla|Edición C': `Edición: Edición C\nUsuario: carla\nTipo: General\nFecha: 10/03/2025\nCosto: $150`
    };

    const selectUsuario = document.getElementById('selectUsuario');
    const selectRegistro = document.getElementById('selectRegistro');
    const btnDetalle = document.getElementById('btnDetalle');
    const textarea = document.getElementById('detalle');

    // Cargar usuarios
    usuarios.forEach(u => {
      const opt = document.createElement('option');
      opt.value = u;
      opt.textContent = u;
      selectUsuario.appendChild(opt);
    });

    // Al cambiar usuario
    selectUsuario.addEventListener('change', () => {
      const usuario = selectUsuario.value;
      selectRegistro.innerHTML = '';
      textarea.value = '';
      btnDetalle.disabled = true;

      if (!usuario || !(usuario in registrosPorUsuario)) {
        selectRegistro.disabled = true;
        return;
      }

      const registros = registrosPorUsuario[usuario];
      if (registros.length === 0) {
        selectRegistro.disabled = true;
        alert('Este usuario no tiene registros.');
        return;
      }

      registros.forEach(r => {
        const opt = document.createElement('option');
        opt.value = r;
        opt.textContent = r;
        selectRegistro.appendChild(opt);
      });

      selectRegistro.disabled = false;
      btnDetalle.disabled = false;
    });

    // Al hacer clic en Ver Detalle
    btnDetalle.addEventListener('click', () => {
      const usuario = selectUsuario.value;
      const registro = selectRegistro.value;
      const key = `${usuario}|${registro}`;

      if (!usuario) {
        alert('No hay usuario seleccionado.');
        return;
      }
      if (!registro) {
        alert('Selecciona un registro.');
        return;
      }

      textarea.value = detalles[key] || 'No se encontró el detalle.';
      textarea.scrollTop = 0;
    });
  </script>
</body>

</html>
