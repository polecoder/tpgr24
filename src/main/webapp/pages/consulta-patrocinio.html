<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eventos UY - Consulta de Patrocinio</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <nav class="d-flex justify-content-between bg-primary p-2 p-sm-3">
      <a
        href="../index.html"
        class="fw-bold text-white text-decoration-none fs-5 fs-sm-4"
      >
        eventos.uy
      </a>
      <ul class="list-unstyled m-0">
        <li>
          <a
            href="./inicio-sesion.html"
            class="text-white text-uppercase text-decoration-underline small"
            >Iniciar sesión</a
          >
        </li>
      </ul>
    </nav>

    <div class="container flex-grow-1">
      <div class="mx-auto" style="max-width: 768px">
        <h1 class="text-center text-uppercase py-4 fs-2 fs-sm-3">
          Consulta de Patrocinio
        </h1>
      </div>

      <main
        class="mx-auto p-4 bg-light border-top border-2 border-primary rounded"
        style="max-width: px"
      >
        <form class="d-flex flex-column gap-4">
          <div class="d-flex justify-content-center gap-3">
            <label
              for="comboEvento"
              class="form-label text-end"
              style="width: 80px"
              >Evento:</label
            >
            <select
              class="form-select"
              id="comboEvento"
              style="width: 250px; font-size: 0.875rem"
            >
              <option selected disabled>--Seleccionar evento--</option>
              <option value="1">Evento 1</option>
              <option value="2">Evento 2</option>
              <option value="3">Evento 3</option>
            </select>
          </div>

          <div class="d-flex justify-content-center gap-3">
            <label
              for="comboEdicion"
              class="form-label text-end"
              style="width: 80px"
              >Edición:</label
            >
            <select
              class="form-select"
              id="comboEdicion"
              style="width: 250px; font-size: 0.875rem"
            >
              <option selected disabled>--Seleccionar edición--</option>
              <option value="1">Edición 1</option>
              <option value="2">Edición 2</option>
              <option value="3">Edición 3</option>
            </select>
          </div>

          <div class="d-flex justify-content-center gap-3">
            <label
              for="comboPatrocinio"
              class="form-label text-end"
              style="width: 80px"
              >Patrocinio:</label
            >
            <select
              class="form-select"
              id="comboPatrocinio"
              style="width: 250px; font-size: 0.875rem"
            >
              <option selected disabled>--Seleccionar patrocinio--</option>
              <option value="1">Patrocinio 1</option>
              <option value="2">Patrocinio 2</option>
              <option value="3">Patrocinio 3</option>
            </select>
          </div>

          <div class="d-flex justify-content-center gap-3">
            <label
              for="institucion"
              class="form-label text-end"
              style="width: 80px"
              >Institución:</label
            >
            <input
              type="text"
              id="institucion"
              name="institucion"
              class="form-control form-control-sm px-2"
              style="width: 250px"
              value="Facultad de Ingeniería"
              readonly
            />
          </div>

          <div class="d-flex justify-content-center gap-3">
            <label for="fecha" class="form-label text-end" style="width: 80px"
              >Fecha:</label
            >
            <input
              type="text"
              id="fecha"
              name="fecha"
              class="form-control form-control-sm px-2"
              style="width: 250px"
              value="13/09/2025"
              readonly
            />
          </div>

          <div class="d-flex justify-content-center gap-3">
            <label for="aporte" class="form-label text-end" style="width: 80px"
              >Aporte:</label
            >
            <input
              type="text"
              id="aporte"
              name="aporte"
              class="form-control form-control-sm px-2"
              style="width: 250px"
              value="13000.00"
              readonly
            />
          </div>

          <div class="d-flex justify-content-center gap-3">
            <label for="nivel" class="form-label text-end" style="width: 80px"
              >Institución:</label
            >
            <input
              type="text"
              id="nivel"
              name="nivel"
              class="form-control form-control-sm px-2"
              style="width: 250px"
              value="Platino"
              readonly
            />
          </div>

          <div class="d-flex justify-content-center gap-3">
            <label
              for="cuposGratuitos"
              class="form-label text-end"
              style="width: 80px"
              >Cupos:</label
            >
            <input
              type="text"
              id="cuposGratuitos"
              name="cuposGratuitos"
              class="form-control form-control-sm px-2"
              style="width: 250px"
              value="14"
              readonly
            />
          </div>

          <div class="d-flex justify-content-center gap-3">
            <button type="button" class="btn btn-primary btn-sm px-3">
              Aceptar
            </button>
            <button type="button" class="btn btn-primary btn-sm px-3">
              Cancelar
            </button>
            <button type="reset" class="btn btn-primary btn-sm px-3">
              Reset
            </button>
          </div>
        </form>
      </main>
    </div>

    <footer
      class="bg-primary text-white d-flex justify-content-between align-items-center p-2 p-sm-3 mt-auto"
    >
      <p class="fw-bold m-0">TPROG 2025</p>
      <p class="m-0">Grupo 24</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
