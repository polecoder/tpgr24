<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eventos UY - Alta de Usuario</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <nav class="d-flex justify-content-between bg-primary p-2 p-sm-3">
      <a
        href="../index.html"
        class="fw-bold text-white text-decoration-none fs-5 fs-sm-4"
      >
        eventos.uy
      </a>
      <ul class="list-unstyled m-0">
        <li>
          <a
            href="./inicio-sesion.html"
            class="text-white text-uppercase text-decoration-underline small"
            >Iniciar sesión</a
          >
        </li>
      </ul>
    </nav>

    <div class="container flex-grow-1">
      <div class="mx-auto" style="max-width: 768px">
        <h1 class="text-center text-uppercase py-4 fs-2 fs-sm-3">
          Alta de usuario
        </h1>
      </div>

      <main
        class="mx-auto p-4 bg-light border-top border-2 border-primary rounded"
        style="max-width: 720px"
      >
      <div id="alert-area" class="mb-3"></div>
        <form id="altaUsuarioForm"
      			method="post"
      			action="../alta-usuario"
      			enctype="multipart/form-data"
      			novalidate
      			class="d-flex flex-column gap-4">
      			
      			<div class="d-flex justify-content-center gap-3">
  					<label class="form-label text-end" style="width: 80px">Tipo:</label>

  				<div>
   			 		<div class="form-check form-check-inline">
      					<input class="form-check-input" type="radio" name="tipo" id="tipoAsistente" value="ASISTENTE">
      					<label class="form-check-label" for="tipoAsistente">Asistente</label>
    				</div>
    				<div class="form-check form-check-inline">
      					<input class="form-check-input" type="radio" name="tipo" id="tipoOrganizador" value="ORGANIZADOR">
      					<label class="form-check-label" for="tipoOrganizador">Organizador</label>
    				</div>
    				<div id="tipoFeedback" class="invalid-feedback d-block" style="display:none;">Seleccioná un tipo.</div>
 				 </div>
			</div>

          <div class="d-flex justify-content-center gap-3">
            <label for="nickname" class="form-label text-end" style="width: 80px"
              >Nickname:</label
            >
            <input
              type="text"
              id="nickname"
              name="nickname"
              required
              class="form-control form-control-sm"
              style="max-width: 200px"
            />
          </div>

           <div class="d-flex justify-content-center gap-3">
            <label for="nombre" class="form-label text-end" style="width: 80px"
              >Nombre:</label
            >
            <input
              type="text"
              id="nombre"
              name="nombre"
              required
              class="form-control form-control-sm"
              style="max-width: 200px"
            />
          </div>

          <div class="d-flex justify-content-center gap-3">
            <label for="email" class="form-label text-end" style="width: 80px"
              >Correo:</label
            >
            <input
              type="email"
              id="email"
              name="email"
              class="form-control form-control-sm"
              style="max-width: 200px"
            />
          </div>

		<div class="d-flex justify-content-center gap-3">
            <label for="password" class="form-label text-end" style="width: 80px"
              >Contraseña:</label
            >
            <input
              type="password"
              id="password"
              name="password"
              class="form-control form-control-sm"
              style="max-width: 200px"
            />
          </div>

        <div class="d-flex justify-content-center gap-3">
            <label for="confirmPassword" class="form-label text-end" style="width: 80px"
              >Confirmacion:</label
            >
            <input
              type="password"
              id="confirmPassword"
              name="ConfirmPassword"
              class="form-control form-control-sm"
              style="max-width: 200px"
              required
            />
          </div>

        <div class="d-flex justify-content-center gap-3">
            <label for="imagen" class="form-label text-end" style="width: 80px"
              >Imagen:</label
            >
            <input
              type="file"
              id="imagen"
              name="imagen"
              accept="image/*"
              class="form-control form-control-sm"
              style="max-width: 200px"
            />
          </div>

<div id="bloqueOrganizador" class="d-none border-top pt-3">
  <div class="d-flex justify-content-center gap-3">
    <label for="descripcion" class="form-label text-end" style="width: 80px">Descripción:</label>
    <textarea id="descripcion" name="descripcion" rows="3"
              class="form-control form-control-sm" style="max-width: 200px"></textarea>
  </div>

  <div class="d-flex justify-content-center gap-3">
    <label for="sitioWeb" class="form-label text-end" style="width: 80px">Sitio web:</label>
    <input type="url" id="sitioWeb" name="sitioWeb" placeholder="https://…"
           class="form-control form-control-sm" style="max-width: 200px"/>
  </div>
</div>

<div id="bloqueAsistente" class="d-none border-top pt-3">
  <div class="d-flex justify-content-center gap-3">
    <label for="apellido" class="form-label text-end" style="width: 80px">Apellido:</label>
    <input type="text" id="apellido" name="apellido"
           class="form-control form-control-sm" style="max-width: 200px"/>
  </div>

  <div class="d-flex justify-content-center gap-3">
    <label for="fechaNacimiento" class="form-label text-end" style="width: 80px">Nacimiento:</label>
    <input type="date" id="fechaNacimiento" name="fechaNacimiento"
           class="form-control form-control-sm" style="max-width: 200px"/>
  </div>

  <div class="d-flex justify-content-center gap-3">
    <label class="form-label text-end" style="width: 80px"></label>
    <div class="form-check">
      <input id="perteneceInstitucion" name="perteneceInstitucion" type="checkbox" class="form-check-input">
      <label class="form-check-label" for="perteneceInstitucion">Pertenece a una institución</label>
    </div>
  </div>

  <div id="filaInstitucion" class="d-none d-flex justify-content-center gap-3">
    <label for="institucionId" class="form-label text-end" style="width: 80px">Institución:</label>
    <select id="institucionId" name="institucionId" class="form-select form-select-sm" style="max-width: 200px">
      <option value="" selected disabled>-- seleccionar --</option>
    </select>
  </div>
</div>

          <div class="d-flex justify-content-center gap-3">
            <button type="submit" class="btn btn-primary btn-sm px-3">
              Aceptar
            </button>
            <button type="reset" class="btn btn-primary btn-sm px-3">
              Reset
            </button>
          </div>
        </form>
      </main>
    </div>

    <footer
      class="bg-primary text-white d-flex justify-content-between align-items-center p-2 p-sm-3 mt-auto"
    >
      <p class="fw-bold m-0">TPROG 2025</p>
      <p class="m-0">Grupo 24</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/alta-usuario.js"></script>
  </body>
</html>
