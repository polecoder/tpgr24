<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eventos UY - Template</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"

    />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <nav class="d-flex justify-content-between bg-primary p-2 p-sm-3">
      <a
        href="../index.html"
        class="fw-bold text-white text-decoration-none fs-5 fs-sm-4"
      >
        eventos.uy

      <ul class="list-unstyled m-0">
        <li class="d-flex gap-3">
          <img
            src="../images/IMG-US04.jpeg"

          />
          <a href="#" class="text-white m-0" style="line-height: 48px"
            >MisEventos</a
          >
        </li>
      </ul>
    </nav>

    <div class="container flex-grow-1">
      <div class="mx-auto" style="max-width: 768px">

        </h1>

      <div class="d-flex justify-content-between">

          <h3 class="text-white bg-primary p-1 fs-5">Categorías</h3>
          <a
            href="#"
            class="d-block px-1 text-primary"
            style="font-size: 0.875rem"

          <a

            class="d-block px-1 text-primary"
            style="font-size: 0.875rem"

        </div>
      </nav>

      <main

        <form class="d-flex flex-column gap-2">
          <div class="d-flex flex-row justify-content-between align-items-start mb-2">
			  <div class="row mb-3 align-items-center">
          <div class="col-4 text-center">
            <img
            src="../images/IMG-EV04.png"
            id="img-portada"
            alt="Portada"
            class="img-fluid ms-3 mt-1 me-5"
            style="max-width: 100px; max-height: 100px; width: auto; height: auto;"
            >
          </div>
          <div class="col-8">
            <label for="label-sigla" class="col-8 form-label fw-bold fs-3" style="margin-right: 8px; white-space: nowrap;"
              >Maratón de Montevideo
            </label>
          </div>
        </div>
		</div>
			
		  <div class="d-flex flex-row align-items-baseline mb-2" style="display: flex; align-items: center;">
            <label for="label-sigla" class="form-label" style="margin-right: 8px; white-space: nowrap;"
              >Sigla:
            </label>
            <div class="form-control-plaintext fst-italic">
              <label for="label-sigla" class="form-label" style="margin-right: 8px; white-space: nowrap;"
              >MARATON
            </label>
            </div>
          </div>
		
          <div class="d-flex flex-row align-items-baseline mb-2" style="display: flex; align-items: center;">
            <label for="label-descripcion" class="form-label me-2" style="white-space: nowrap"

            </label>
            <div class="form-control-plaintext fst-italic">
              <label for="label-sigla" class="form-label" style="margin-right: 8px;"
              >Competencia deportiva anual en la capital
            </label>
            </div>
          </div>
          
          <div class="d-flex flex-row align-items-baseline mb-2" style="display: flex; align-items: center;">
            <label for="label-categorias" class="form-label" style="margin-right: 8px; white-space: nowrap;"
              >Categorias:
            </label>
            <div class="form-control-plaintext fst-italic">
              <label for="label-sigla" class="form-label" style="margin-right: 8px;"
              >Deporte, Salud
            </label>
            </div>
          </div>
          
            <div class="row mb-3 align-items-center">
          <div class="col-4 text-center">

          <div class="col-8">
            <a href="./consulta-edicion-maraton-montevideo-2024-visitante.html" class="col-8 fs-5 text-decoration-none" style="margin-right: 8px; white-space: nowrap;">

      </div>

      <p class="m-0">Grupo 24</p>
