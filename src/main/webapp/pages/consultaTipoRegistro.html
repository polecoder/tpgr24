<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eventos UY - Template</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <nav class="d-flex justify-content-between bg-primary p-2 p-sm-3">
      <a
        href="../index.html"
        class="fw-bold text-white text-decoration-none fs-5 fs-sm-4"
      >
        eventos.uy
      </a>
      <ul class="list-unstyled m-0">
        <li>
          <a
            href="./inicio-sesion.html"
            class="text-white text-uppercase text-decoration-underline small"
            >Iniciar sesión</a
          >
        </li>
      </ul>
    </nav>

    <div class="container flex-grow-1">
      <div class="mx-auto" style="max-width: 768px">
        <h1 class="text-center text-uppercase py-4 fs-2 fs-sm-3">
          Consulta de Tipo de Registro
        </h1>
      </div>

      <main
        class="mx-auto p-4 bg-light border-top border-2 border-primary rounded"
        style="max-width: 500px"
      >
        <form class="d-flex flex-column gap-2">
          <div class="d-flex flex-column mb-2">
            <label for="label-evento" class="form-label" style="white-space: nowrap"
              >Seleccione el evento:<span class="text-danger">*</span>
            </label>
            <select id="dropdown-evento" name="dropdown-evento" class="form-select form-select-sm">
            	<option value="Maratón de Montevideo">Maratón de Montevideo </option>
            </select>
          </div>
          
          <div class="d-flex flex-column mb-2">
            <label for="label-edicion" class="form-label" style="white-space: nowrap"
              >Seleccione la edición:<span class="text-danger">*</span>
            </label>
            <select id="dropdown-edicion" name="dropdown-evento" class="form-select form-select-sm">
            	<option value="Maratón de Montevideo">Maratón 2025 </option>
            </select>
          </div>

		  <div class="d-flex flex-column mb-2">
            <label for="label-tipoRegistro" class="form-label" style="white-space: nowrap"
              >Seleccione el tipo de registro:<span class="text-danger">*</span>
            </label>
            <select id="dropdown-tipoRegistro" name="dropdown-evento" class="form-select form-select-sm">
            	<option value="Maratón de Montevideo">Corredor 10K </option>
            </select>
          </div>
			
          <div class="d-flex flex-column mb-2">
            <label for="label-descripcion" class="form-label" style="white-space: nowrap"
              >Descripción:
            </label>
            <div class="form-control-plaintext fst-italic">Corredor de 10 kilometros</div>
          </div>

          <div class="d-flex flex-row align-items-baseline mb-2" style="display: flex; align-items: center;">
            <label for="label-descripcion" class="form-label" style="margin-right: 8px; white-space: nowrap;"
              >Costo:
            </label>
            <div class="form-control-plaintext fst-italic">$2.000</div>
          </div>
          
          <div class="d-flex flex-row align-items-baseline mb-2" style="display: flex; align-items: center;">
            <label for="label-descripcion" class="form-label" style="margin-right: 8px; white-space: nowrap;"
              >Cupos máximos:
            </label>
            <div class="form-control-plaintext fst-italic">100</div>
          </div>
          
          <div class="d-flex flex-row align-items-baseline mb-2" style="display: flex; align-items: center;">
            <label for="label-descripcion" class="form-label" style="margin-right: 8px; white-space: nowrap;"
              >Cupos disponibles:
            </label>
            <div class="form-control-plaintext fst-italic">75</div>
          </div>
        </form>
      </main>
    </div>

    <footer
      class="bg-primary text-white d-flex justify-content-between align-items-center p-2 p-sm-3 mt-auto"
    >
      <p class="fw-bold m-0">TPROG 2025</p>
      <p class="m-0">Grupo 24</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JS/consultaTipoRegistro.js"></script>
  </body>
</html>
