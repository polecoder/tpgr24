<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eventos UY</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>

<body class="d-flex flex-column min-vh-100">
    <nav class="d-flex justify-content-between bg-primary p-2 p-sm-3">
        <a href="../index-asistente.html" class="fw-bold text-white text-decoration-none fs-5 fs-sm-4" style="line-height: 48px">eventos.uy</a>
        <ul class="list-unstyled m-0 d-flex gap-3">
            <li class="d-flex gap-3">
                <img src="../images/IMG-US01.jpg" alt="Imagen usuario" style="width: 48px; height: 48px"/>
                <a href="./ConsultaUsuario.html" class="text-white m-0" style="line-height: 48px">Ana Torres</a>
            </li>
            <li class="text-uppercase text-white" style="line-height: 48px">
                <a href="../index-visitante.html" class="text-white">Cerrar Sesión</a>
            </li>
        </ul>
    </nav>
    <div class="container flex-grow-1 py-4">
        <div class="mx-auto" style="max-width: 768px">
            <h1 class="text-center text-uppercase py-4 fs-2 fs-sm-3">Registro a Edición de Evento</h1>
        </div>
        <div class="d-flex justify-content-between">
            <!-- Sidebar -->
             <nav class="border-primary border rounded mb-4" style="width: 200px; height: fit-content;">
                <div class="mb-2">
                    <h3 class="text-white bg-primary p-1 fs-5">Operaciones</h3>
                    <a href="consultaEvento.html" class="d-block px-1 text-primary" style="font-size: 0.875rem">Consultar Evento</a>
                </div>
            </nav>
            <!-- Main Content -->
             <main class="mx-auto p-4 bg-light border-top border-2 border-primary rounded" style="max-width: 720px">
                <div id="alert-area" class="mb-3"></div>
                <form id="registroEdicionEventoForm" method="post" action="../RegistroAEdicionEvento" enctype="multipart/form-data" novalidate class="d-flex flex-column gap-4">
                    <div class="d-flex justify-content-center gap-3">
                        <label for="evento" class="form-label text-end" style="width: 80px">Evento</label>
                        <select id="evento" name="evento" required class="form-select" style="max-width:400px" disabled>
                            <option selected>Maratón de Montevideo</option>
                            <!-- Opciones dinámicas -->
                        </select>
                    </div>
                    <div class="d-flex justify-content-center gap-3">
                        <label for="edicion" class="form-label text-end" style="width: 80px;">Edición</label>
                        <select id="edicion" name="edicion" required class="form-select" style="max-width: 400px;" disabled>
                            <option selected>Maratón de Montevideo 2024</option>
                        </select>
                    </div>
                    <div class="d-flex justify-content-center gap-3">
                        <label for="tipoRegistro" class="form-label text-end" style="width: 80px;">Tipo de Registro</label>
                        <select id="tipoRegistro" name="tipoRegistro" required class="form-select" style="max-width: 400px;">
                            <option selected>Corredor 21K</option>
                        </select>
                    </div>
                    <div class="d-flex justify-content-center gap-3">
                        <label for="asistente" class="form-label text-end" style="width: 80px;">Asistente</label>
                        <select id="asistente" name="asistente" required class="form-select" style="max-width: 400px;" disabled>
                            <option selected>Ana Torres</option>
                        </select>
                    </div>
                    <div class="d-flex justify-content-center gap-3">
                        <label for="codigoPatrocinio" class="form-label text-start" style="width: 80px;">Código de Patrocinio</label>
                        <input type="text" id="codigoPatrocinio" name="codigoPatrocinio" class="form-control form-control-sm" style="max-width: 400px;" />
                    </div>
                    <div class="text-end">
                        <button type="submit" class="btn btn-primary me-2">Aceptar</button>
                        <button type="reset" class="btn btn-secondary">Cancelar</button>
                    </div>
                </form>
            </main>
        </div>
    </div>
    <footer class="bg-primary text-white d-flex justify-content-between align-items-center p-2 p-sm-3 mt-auto">
        <p class="fw-bold m-0">TPROG 2025</p>
        <p class="m-0">Grupo 24</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
