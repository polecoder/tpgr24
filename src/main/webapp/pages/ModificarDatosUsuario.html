<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eventos UY - Modificar Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body class="d-flex flex-column min-vh-100">
    <!-- NAV -->
    <nav class="d-flex justify-content-between bg-primary p-2 p-sm-3">
        <a href="#" class="fw-bold text-white text-decoration-none fs-5 fs-sm-4" style="line-height: 48px">
            eventos.uy
        </a>
        <ul class="list-unstyled m-0 d-flex gap-3">
            <li class="d-flex gap-3">
                <img src="./images/IMG-US01.jpg" alt="Imagen usuario" style="width: 48px; height: 48px" />
                <a href="#" class="text-white m-0" style="line-height: 48px">Ana Torres</a>
            <li class="text-uppercase text-white" style="line-height: 48px">
                <a href="#" class="text-white">Cerrar Sesión</a>
            </li>
            </li>
        </ul>
    </nav>

    <!-- MAIN -->
    <div class="container flex-grow-1">
        <div class="mx-auto" style="max-width: 768px">
            <h1 class="text-center text-uppercase py-4 fs-2 fs-sm-3">
                Modificar Datos de Usuario
            </h1>

            <form class="row g-3">
                <!-- Usuario -->
                <div class="col-md-6">
                    <label for="usuario" class="form-label">Usuario:</label>
                    <select class="form-select" id="usuario">
                        <option selected>--Seleccionar un Usuario--</option>
                        <option value="1">usuario1</option>
                        <option value="2">usuario2</option>
                        <option value="3">usuario3</option>
                    </select>
                </div>

                <!-- Correo -->
                <div class="col-md-6">
                    <label for="correo" class="form-label">Correo:</label>
                    <input type="email" class="form-control" id="correo" placeholder="correo@ejemplo.com" readonly />
                </div>

                <!-- Nombre -->
                <div class="col-md-6">
                    <label for="nombre" class="form-label">Nombre:</label>
                    <input type="text" class="form-control" id="nombre" />
                </div>

                <!-- Card panels -->
                <div class="col-12">
                    <div id="card-asistente" class="border rounded p-3 d-none">
                        <div class="mb-3">
                            <label for="apellido" class="form-label">Apellido:</label>
                            <input type="text" class="form-control" id="apellido" />
                        </div>
                        <div class="mb-3">
                            <label for="fecha" class="form-label">Nacimiento:</label>
                            <input type="date" class="form-control" id="fecha" />
                        </div>
                    </div>

                    <div id="card-organizador" class="border rounded p-3 d-none">
                        <div class="mb-3">
                            <label for="descripcion" class="form-label">Descripción:</label>
                            <textarea class="form-control" id="descripcion" rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="link" class="form-label">Link:</label>
                            <input type="url" class="form-control" id="link" />
                        </div>
                    </div>
                </div>

                <!-- Botones -->
                <div class="col-12 d-flex justify-content-end gap-2">
                    <button type="submit" class="btn btn-primary">Aceptar</button>
                    <button type="reset" class="btn btn-secondary">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-primary text-white d-flex justify-content-between align-items-center p-2 p-sm-3 mt-auto">
        <p class="fw-bold m-0">TPROG 2025</p>
        <p class="m-0">Grupo 24</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../js/ModificarDatosUsuario.js"></script>
</body>

</html>
