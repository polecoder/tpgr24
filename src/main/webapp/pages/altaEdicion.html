<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eventos UY - Template</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <nav class="d-flex justify-content-between bg-primary p-2 p-sm-3">
      <a
        href="../index.html"
        class="fw-bold text-white text-decoration-none fs-5 fs-sm-4"
      >
        eventos.uy
      </a>
      <ul class="list-unstyled m-0">
        <li>
          <a
            href="./inicio-sesion.html"
            class="text-white text-uppercase text-decoration-underline small"
            >Iniciar sesión</a
          >
        </li>
      </ul>
    </nav>

    <div class="container flex-grow-1">
      <div class="mx-auto" style="max-width: 768px">
        <h1 class="text-center text-uppercase py-4 fs-2 fs-sm-3">
          Alta de Edición de Evento
        </h1>
      </div>

      <main
        class="mx-auto p-4 bg-light border-top border-2 border-primary rounded"
        style="max-width: 500px"
      >
        <form class="d-flex flex-column gap-2">
          <div class="d-flex flex-column mb-2">
            <label for="label-evento" class="form-label" style="white-space: nowrap"
              >Seleccione el evento:<span class="text-danger">*</span></label
            >
            <select id="dropdown-evento" name="dropdown-evento" class="form-select form-select-sm">
            	<option value="Maratón de Montevideo">Maratón de Montevideo </option>
            </select>
          </div>

          <div class="d-flex flex-column mb-2">
            <label for="label-nombre" class="form-label" style="white-space: nowrap"
              >Nombre de la edición:<span class="text-danger">*</span>
            </label>
            <input
              type="text"
              id="txt-edicion"
              name="nombreEdicion"
              class="form-control form-control-sm"
              style="max-width: 450px"
            />
          </div>

          <div class="d-flex flex-column mb-2">
            <label for="label-sigla" class="form-label" style="white-space: nowrap"
              >Sigla de la edición:<span class="text-danger">*</span>
            </label>
            <input
              type="text"
              id="txt-sigla"
              name="sigla"
              class="form-control form-control-sm"
              style="max-width: 450px"
            />
          </div>
          
          <div class="d-flex flex-column mb-2">
            <label for="label-sigla" class="form-label" style="white-space: nowrap"
              >País:<span class="text-danger">*</span>
            </label>
            <input
              type="text"
              id="txt-pais"
              name="pais"
              class="form-control form-control-sm"
              style="max-width: 450px"
            />
          </div>
          
          <div class="d-flex flex-column mb-2">
            <label for="label-sigla" class="form-label" style="white-space: nowrap"
              >Ciudad:<span class="text-danger">*</span>
            </label>
            <input
              type="text"
              id="txt-ciudad"
              name="ciudad"
              class="form-control form-control-sm"
              style="max-width: 450px"
            />
          </div>
          
          <div class="d-flex flex-column mb-2">
            <label for="label-sigla" class="form-label" style="white-space: nowrap"
              >Fecha de inicio de la edición:<span class="text-danger">*</span>
            </label>
            <input
              type="date"
              id="fechaInicio"
              name="input-fechaInicio"
              class="form-control form-control-sm"
              style="max-width: 450px"
            />
          </div>
          
          <div class="d-flex flex-column mb-2">
            <label for="label-sigla" class="form-label" style="white-space: nowrap"
              >Fecha de fin de la edición:<span class="text-danger">*</span>
            </label>
            <input
              type="date"
              id="input-fechaFin"
              name="fechaFin"
              class="form-control form-control-sm"
              style="max-width: 450px"
            />
          </div>
          
          <div class="d-flex flex-column mb-2">
            <label for="label-sigla" class="form-label" style="white-space: nowrap"
              >Imágen de la edición:
            </label>
            <input
              type="file"
              id="input-image"
              name="image"
              accept="image/*"
              class="form-control form-control-sm"
              style="max-width: 450px"
            />
          </div>

          <div class="d-flex justify-content-center gap-3">
            <button type="button" class="btn btn-primary btn-sm px-3">Aceptar</button>
            <button type="reset" class="btn btn-primary btn-sm px-3">Reset</button>
          </div>
        </form>
      </main>
    </div>

    <footer
      class="bg-primary text-white d-flex justify-content-between align-items-center p-2 p-sm-3 mt-auto"
    >
      <p class="fw-bold m-0">TPROG 2025</p>
      <p class="m-0">Grupo 24</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JS/altaEdicion.js"></script>
  </body>
</html>
