<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eventos UY - Template</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div class="max-w-3xl mx-auto">
      <div>
        <h1 class="text-2xl uppercase text-center py-4">
          Template para las páginas de caso de uso
        </h1>
        <p class="pt-4 px-4 pb-8">
          Tengo un tamaño estándar y cuando agrandas mucho la pantalla me
          centro, para respetar los tamaños de pantalla más pequeños.
        </p>
      </div>
      <main
        class="max-w-xs mx-auto bg-blue-50 py-4 rounded-md border-t-2 border-blue-400"
      >
        <form action="" class="flex flex-col gap-8">
          <div class="flex justify-center gap-4">
            <label class="leading-7" for="campo1">Campo 1:</label>
            <input
              class="bg-white rounded py-0.5 focus:outline-none"
              type="text"
              name="Campo1"
              id="campo1"
            />
          </div>
          <div class="flex justify-center gap-4">
            <label class="leading-7" for="campo2">Campo 2:</label>
            <input
              class="bg-white rounded py-0.5 focus:outline-none"
              type="text"
              name="Campo2"
              id="campo2"
            />
          </div>
          <div class="flex justify-center gap-4">
            <label class="leading-7" for="campo3">Campo 3:</label>
            <input
              class="bg-white rounded py-0.5 focus:outline-none"
              type="text"
              name="Campo3"
              id="campo3"
            />
          </div>
          <div class="flex justify-between mx-4">
            <input
              class="px-2 py-1 text-white bg-blue-400 rounded w-20"
              type="button"
              value="Aceptar"
            />
            <input
              class="px-2 py-1 text-white bg-blue-400 rounded w-20"
              type="button"
              value="Cancelar"
            />
            <input
              class="px-2 py-1 text-white bg-blue-400 rounded w-20"
              type="button"
              value="Reset"
            />
          </div>
        </form>
      </main>
    </div>
  </body>
</html>
