<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consulta Usuario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body class="d-flex flex-column min-vh-100">
  <nav class="d-flex justify-content-between bg-primary p-2 p-sm-3">
    <a href="../index-asistente.html" class="fw-bold text-white text-decoration-none fs-5 fs-sm-4" style="line-height: 48px">
      eventos.uy
    </a>
    <ul class="list-unstyled m-0 d-flex gap-3">
      <li class="text-uppercase text-white" style="line-height: 48px">
        <a href="./inicio-sesion.html" class="text-white text-uppercase text-decoration-underline small">Iniciar Sesión</a>
      </li>
      </li>
    </ul>
  </nav>

  <div class="container flex-grow-1 my-4">
    <div class="mx-auto" style="max-width: 512px">
      <h1 class="text-center text-uppercase py-3 fs-2 fs-sm-3">
        Datos de usuario
      </h1>
       <form class="bg-light border-top border-2 border-primary rounded p-4 flex-grow-1" >
        
          <!-- Imagen -->
          <div class="mb-3 row">
            <label for="image" class="col-sm-4 col-form-im text-start"></label>
            <div class="col-sm-8">
              <img src="../images/IMG-US04.jpeg" id="image" alt="Imagen previa" class="img-fluid rounded"
                style="max-height: 100px;" />
            </div>
          </div>

          <!-- Nickname -->
          <div class="mb-3 row">
            <label for="nombre" class="col-sm-4 col-form-label text-end">Nickname:</label>
            <div class="col-sm-8">
              <input type="text" id="nombre" class="form-control form-control-sm" readonly value="miseventos" />
            </div>
          </div>

          <!-- Nombre -->
          <div class="mb-3 row">
            <label for="nombre" class="col-sm-4 col-form-label text-end">Nombre:</label>
            <div class="col-sm-8">
              <input type="text" id="nombre" class="form-control form-control-sm" readonly value="MisEventos" />
            </div>
          </div>

          <!-- Correo -->
          <div class="mb-3 row">
            <label for="correo" class="col-sm-4 col-form-label text-end">Correo:</label>
            <div class="col-sm-8">
              <input type="text" id="correo" class="form-control form-control-sm" readonly
                value="contacto@miseventos.com" />
            </div>
          </div>

          <!-- Panel dinámico: Asistente u Organizador -->
          <div id="panelAsistenteOrganizador">
            <!-- Asistente -->
            <div id="asistenteFields" class="d-none">
              <!-- Apellido -->
              <div class="mb-3 row">
                <label for="apellido" class="col-sm-4 col-form-label text-end">Apellido:</label>
                <div class="col-sm-8">
                  <input type="text" id="apellido" class="form-control form-control-sm" readonly value="Torres" />
                </div>
              </div>

              <!-- Institución -->
              <div class="mb-3 row">
                <label for="institucion" class="col-sm-4 col-form-label text-end">Institución:</label>
                <div class="col-sm-8">
                  <input type="text" id="institucion" class="form-control form-control-sm" readonly
                    value="Facultad de Ingeniería" />
                </div>
              </div>

              <!-- Fecha de nacimiento -->
              <div class="mb-3 row">
                <label for="nacimiento" class="col-sm-4 col-form-label text-end">Nacimiento:</label>
                <div class="col-sm-8">
                  <input type="text" id="nacimiento" class="form-control form-control-sm" readonly value="12/05/1990" />
                </div>
              </div>

              <!-- Registros -->
              <div class="mb-3 row">
                <label for="registros" class="col-sm-4 col-form-label text-end">Registros:</label>
                <div class="col-sm-8">
                  <select id="registros" class="form-select form-select-sm">
                    <!-- Opciones dinámicas -->
                    <option selected>Maratón de Montevideo 2024</option>
                    <option>Web Summit 2026</option>
                  </select>
                </div>
              </div>
            </div>

            <!-- Organizador -->
            <div id="organizadorFields">
              <!-- Descripción -->
              <div class="mb-3 row">
                <label for="descripcion" class="col-sm-4 col-form-label text-end">Descripción:</label>
                <div class="col-sm-8">
                  <textarea id="descripcion" class="form-control form-control-sm" rows="2"
                    readonly>Empresa de organización de eventos.</textarea>
                </div>
              </div>

              <!-- Link -->
              <div class="mb-3 row">
                <label for="link" class="col-sm-4 col-form-label text-end">Link:</label>
                <div class="col-sm-8">
                  <input type="text" id="link" class="form-control form-control-sm" readonly
                    value="https://miseventos.com" />
                </div>
              </div>

              <!-- Ediciones -->
              <div class="mb-3 row">
                <label for="ediciones" class="col-sm-4 col-form-label text-end">Ediciones:</label>
                <div class="col-sm-8 d-flex flex-column gap-2">
                  <a href="consulta-edicion-visitante.html"
                    class="text-primary text-decoration-underline">Maratón de Montevideo 2024</a>
                  <!-- Agrega más ediciones aquí -->
                </div>
              </div>
            </div>
          </div>
      </div>
      </form>
  </div>
  </div>

  <footer class="bg-primary text-white d-flex justify-content-between align-items-center p-2 p-sm-3 mt-auto">
    <p class="fw-bold m-0">TPROG 2025</p>
    <p class="m-0">Grupo 24</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- JavaScript básico para cambiar entre campos según tipo de usuario -->
  <script src="../js/ConsultaUsuario.js"></script>
</body>

</html>
