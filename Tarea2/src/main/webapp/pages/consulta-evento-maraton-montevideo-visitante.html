<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eventos UY - Template</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <!-- Barra de navegación -->
    <nav class="d-flex justify-content-between bg-primary p-2 p-sm-3">
      <a
        href="../index-visitante.html"
        class="fw-bold text-white text-decoration-none fs-5 fs-sm-4"
      >
        eventos.uy
      </a>
      <ul class="list-unstyled m-0">
        <li>
          <a
            href="./inicio-sesion.html"
            class="text-white text-uppercase text-decoration-underline small"
            >Iniciar sesión</a
          >
        </li>
      </ul>
    </nav>

    <div class="container flex-grow-1">
      <div class="mx-auto" style="max-width: 768px">
        <h1 class="text-center text-uppercase py-4 fs-2 fs-sm-3">
          Consulta de Evento
        </h1>
      </div>

      <div
        class="d-flex justify-content-between mx-auto"
        style="max-width: 900px"
      >
        <main
          class="p-4 bg-light border-top border-2 border-primary rounded"
          style="max-width: 768px"
        >
          <form class="d-flex flex-column gap-2">
            <div
              class="d-flex flex-row justify-content-between align-items-center mb-2"
            >
              <img
                src="../images/IMG-EV04.png"
                id="img-portada"
                alt="Portada"
                style="width: 96px; height: 96px"
              />
              <h3 class="fw-bold fs-4 m-0">Maratón de Montevideo</h3>
            </div>

            <div
              class="d-flex flex-row align-items-baseline mb-2"
              style="display: flex; align-items: center"
            >
              <label
                for="label-sigla"
                class="form-label fw-bold"
                style="margin-right: 8px; white-space: nowrap"
                >Sigla:
              </label>
              <div class="form-control-plaintext fst-italic">
                <label
                  for="label-sigla"
                  class="form-label"
                  style="margin-right: 8px; white-space: nowrap"
                  >MARATON
                </label>
              </div>
            </div>

            <div
              class="d-flex flex-row align-items-baseline mb-2"
              style="display: flex; align-items: center"
            >
              <label
                for="label-descripcion"
                class="form-label me-2 fw-bold"
                style="white-space: nowrap"
                >Descripción:
              </label>
              <div class="form-control-plaintext fst-italic">
                <label
                  for="label-sigla"
                  class="form-label"
                  style="margin-right: 8px"
                  >Competencia deportiva anual en la capital
                </label>
              </div>
            </div>

            <div
              class="d-flex flex-row align-items-baseline mb-2"
              style="display: flex; align-items: center"
            >
              <label
                for="label-categorias"
                class="form-label fw-bold"
                style="margin-right: 8px; white-space: nowrap"
                >Categorias:
              </label>
              <div class="form-control-plaintext fst-italic">
                <label
                  for="label-sigla"
                  class="form-label"
                  style="margin-right: 8px"
                  >Deporte, Salud
                </label>
              </div>
            </div>

            <div
              class="d-flex flex-row align-items-baseline mb-2"
              style="display: flex; align-items: center"
            >
              <label
                for="label-descripcion"
                class="form-label me-2 fw-bold"
                style="white-space: nowrap"
                >Fecha de alta:
              </label>
              <div class="form-control-plaintext fst-italic">
                <label
                  for="label-sigla"
                  class="form-label"
                  style="margin-right: 8px"
                  >01/01/2022
                </label>
              </div>
            </div>
          </form>
        </main>
        <aside
          class="border-primary border rounded"
          style="max-width: 375px; height: fit-content"
        >
          <div>
            <h3 class="text-white bg-primary p-2 m-0 fs-4">Ediciones</h3>
            <div class="d-flex align-items-center gap-2 py-2 px-3">
              <img
                src="../images/IMG-EDEV03.jpeg"
                alt="Imagen evento"
                style="width: 64px"
              />
              <!-- TODO: Lleva a CU::ConsultaEdición -->
              <a href="consulta-edicion-visitante.html" class="text-primary"
                >Maratón de Montevideo 2024</a
              >
            </div>
          </div>
          <div>
            <h3 class="text-white bg-primary p-2 m-0 fs-4">Organizador</h3>
            <div class="d-flex align-items-center gap-2 py-2 px-3">
              <img
                src="../images/IMG-US04.jpeg"
                alt="Imagen evento"
                style="width: 64px; height: 64px"
              />
              <!-- TODO: Lleva a CU::ConsultaUsuario -->
              <a
                href="./consulta-usuario-miseventos-visitante.html"
                class="text-primary"
                >MisEventos</a
              >
            </div>
          </div>
        </aside>
      </div>
    </div>

    <footer
      class="bg-primary text-white d-flex justify-content-between align-items-center p-2 p-sm-3 mt-auto"
    >
      <p class="fw-bold m-0">TPROG 2025</p>
      <p class="m-0">Grupo 24</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
