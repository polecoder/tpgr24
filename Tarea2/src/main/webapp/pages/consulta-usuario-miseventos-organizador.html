<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consulta Usuario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body class="d-flex flex-column min-vh-100">
  <nav class="d-flex justify-content-between bg-primary p-2 p-sm-3">
    <a href="../index-organizador.html" class="fw-bold text-white text-decoration-none fs-5 fs-sm-4" style="line-height: 48px">
      eventos.uy
    </a>
    <ul class="list-unstyled m-0 d-flex gap-3">
      <li class="d-flex gap-3">
        <img src="../images/IMG-US04.jpeg" alt="Imagen usuario" style="width: 48px; height: 48px" />
        <a href="./consulta-usuario-miseventos-organizador.html" class="text-white m-0"
          style="line-height: 48px">MisEventos</a>
      <li class="text-uppercase text-white" style="line-height: 48px">
        <a href="../index-visitante.html" type="button" class="btn btn-light btn-sm ms-2">Cerrar Sesión</a>
      </li>
      </li>
    </ul>
  </nav>

  <div class="container flex-grow-1 my-4">
    <div class="mx-auto" style="max-width: 768px">
      <h1 class="text-center text-uppercase py-3 fs-2 fs-sm-3">
        Datos de usuario
      </h1>
      <form class="bg-light border-top border-2 border-primary rounded p-4 flex-grow-1">


        <!-- Imagen -->
        <div class="mb-3 row">
          <label for="image" class="col-sm-4 col-form-im text-start"></label>
          <div class="col-sm-8">
            <img src="../images/IMG-US04.jpeg" id="image" alt="Imagen previa" class="img-fluid rounded"
              style="max-height: 100px;" />
          </div>
        </div>

        <!-- Nickname -->
        <div class="mb-3 row">
          <label for="nombre" class="col-sm-4 col-form-label text-center">Nickname:</label>
          <div class="col-sm-8">
            <input type="text" id="nombre" class="form-control form-control-sm" readonly value="miseventos" />
          </div>
        </div>

        <!-- Nombre -->
        <div class="mb-3 row">
          <label for="nombre" class="col-sm-4 col-form-label text-center">Nombre:</label>
          <div class="col-sm-8">
            <input type="text" id="nombre" class="form-control form-control-sm" readonly value="MisEventos" />
          </div>
        </div>

        <!-- Correo -->
        <div class="mb-3 row">
          <label for="correo" class="col-sm-4 col-form-label text-center">Correo:</label>
          <div class="col-sm-8">
            <input type="text" id="correo" class="form-control form-control-sm" readonly
              value="contacto@miseventos.com" />
          </div>
        </div>

        <!-- Descripción -->
        <div class="mb-3 row">
          <label for="descripcion" class="col-sm-4 col-form-label text-center">Descripción:</label>
          <div class="col-sm-8">
            <textarea id="descripcion" class="form-control form-control-sm" rows="2"
              readonly>Empresa de organización de eventos.</textarea>
          </div>
        </div>

        <!-- Link -->
        <div class="mb-3 row">
          <label for="link" class="col-sm-4 col-form-label text-center">Link:</label>
          <div class="col-sm-8">
            <input type="text" id="link" class="form-control form-control-sm" readonly
              value="https://miseventos.com" />
          </div>
        </div>

        <!-- Ediciones -->
        <div class="mb-3 row">
          <label for="ediciones" class="col-sm-4 col-form-label text-center">Ediciones:</label>
          <div class="col-sm-8 d-flex flex-column gap-2">
            <a href="consulta-edicion-organizador.html"
              class="text-primary text-decoration-underline">Maratón de Montevideo 2024 - Aceptada</a>
            <span class="text-secondary">Maratón de Montevideo 2022 - Rechazada</span>
            <span class="text-secondary">Maratón de Montevideo 2025 - Ingresada</span>
          </div>
        </div>
        <!-- Botón Modificar Usuario con enlace -->
        <div class="text-end mt-4">
          <a href="modificar-usuario.html">
            <a href="./modificar-datos-usuario-miseventos-organizador.html" type="button" class="btn btn-primary">
              Modificar Usuario
            </a>
          </a>
        </div>
      </form>
    </div>
  </div>

  <footer class="bg-primary text-white d-flex justify-content-between align-items-center p-2 p-sm-3 mt-auto">
    <p class="fw-bold m-0">TPROG 2025</p>
    <p class="m-0">Grupo 24</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- JavaScript básico para cambiar entre campos según tipo de usuario -->
  <script src="../js/ConsultaUsuario.js"></script>
</body>

</html>
