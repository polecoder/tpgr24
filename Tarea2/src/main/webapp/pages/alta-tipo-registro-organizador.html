<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eventos UY - Alta Tipo Registro</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <nav class="d-flex justify-content-between bg-primary p-2 p-sm-3">
      <a
        href="../index-organizador.html"
        class="fw-bold text-white text-decoration-none fs-5 fs-sm-4"
        style="line-height: 48px"
      >
        eventos.uy
      </a>
      <ul class="list-unstyled m-0 d-flex gap-3">
        <li class="d-flex gap-3">
          <img
            src="../images/IMG-US04.jpeg"
            alt="Imagen usuario"
            style="width: 48px; height: 48px"
          />
          <a href="./consulta-usuario-miseventos-organizador.html" class="text-white m-0" style="line-height: 48px"
            >MisEventos</a
          >
        </li>
        <li class="text-uppercase text-white" style="line-height: 48px">
          <a href="../index-visitante.html" type="button" class="btn btn-light btn-sm ms-2">Cerrar Sesión</a>
        </li>
      </ul>
    </nav>

    <div class="container flex-grow-1">
      <div class="mx-auto" style="max-width: 768px">
        <h1 class="text-center text-uppercase py-4 fs-2 fs-sm-3">
          Alta de Tipo de Registro
        </h1>
      </div>

      <div
        class="d-flex justify-content-between gap-5 mx-auto"
        style="max-width: 1024px"
      >
        <main
          class="mx-auto p-4 bg-light border-top border-2 border-primary rounded"
          style="max-width: 375px"
        >
          <form class="d-flex flex-column gap-4">

            <div
              class="d-flex align-items-center gap-2 py-2 px-3 justify-content-center"
            >
              <img
                src="../images/IMG-EDEV03.jpeg"
                alt="Imagen evento"
                style="width: 128px"
              />
              <a href="./consulta-edicion-organizador.html" class="text-primary">Maratón de Montevideo 2024</a>
            </div>

            <div class="d-flex gap-2">
              <label for="nombre" class="form-label" style="width: 200px"
                >Nombre: <span class="text-danger">*</span></label
              >
              <input
                type="text"
                id="Nombre"
                class="form-control form-control-sm"
                style="max-width: 300px"
              />
            </div>

            <div class="d-flex gap-2">
              <label for="descripcion" class="form-label" style="width: 200px"
                >Descripción: <span class="text-danger">*</span></label
              >
              <input
                type="text"
                id="Descripcion"
                class="form-control form-control-sm"
                style="max-width: 300px"
              />
            </div>

            <div class="d-flex gap-2">
              <label for="costo" class="form-label" style="width: 200px"
                >Costo: <span class="text-danger">*</span></label
              >
              <input
                type="text"
                id="Costo"
                class="form-control form-control-sm"
                style="max-width: 300px"
              />
            </div>

            <div class="d-flex gap-2">
              <label for="cupos" class="form-label" style="width: 200px"
                >Cupos: <span class="text-danger">*</span></label
              >
              <input
                type="text"
                id="Cupos"
                class="form-control form-control-sm"
                style="max-width: 300px"
              />
            </div>
            <div class="d-flex justify-content-center gap-3">
              <button
                type="button"
                id="btnAceptar"
                class="btn btn-primary btn-sm px-3"
              >
                Aceptar
              </button>
            </div>
          </form>
        </main>
      </div>
    </div>

    <footer
      class="bg-primary text-white d-flex justify-content-between align-items-center p-2 p-sm-3 mt-auto"
    >
      <p class="fw-bold m-0">TPROG 2025</p>
      <p class="m-0">Grupo 24</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/alta-tipo-registro.js"></script>
  </body>
</html>
