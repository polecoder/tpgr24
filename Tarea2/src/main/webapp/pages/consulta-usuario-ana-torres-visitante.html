<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consulta Usuario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body class="d-flex flex-column min-vh-100">
  <nav class="d-flex justify-content-between bg-primary p-2 p-sm-3">
    <a href="../index-visitante.html" class="fw-bold text-white text-decoration-none fs-5 fs-sm-4">
      eventos.uy
    </a>
    <ul class="list-unstyled m-0">
      <li>
        <a href="./inicio-sesion.html" class="text-white text-uppercase text-decoration-underline small">
          Iniciar sesión
        </a>
      </li>
    </ul>
  </nav>

  <div class="container flex-grow-1 my-4">
    <div class="mx-auto" style="max-width: 768px">
      <h1 class="text-center text-uppercase py-3 fs-2 fs-sm-3">
        Consulta Usuario
      </h1>
      <form class="bg-light border-top border-2 border-primary rounded p-4 flex-grow-1">

        <!-- Imagen -->
        <div class="mb-3 row">
          <label for="image" class="col-sm-4 col-form-im text-start"></label>
          <div class="col-sm-8">
            <img src="../images/IMG-US01.jpg" id="image" alt="Imagen previa" class="img-fluid rounded"
              style="max-height: 100px;" />
          </div>
        </div>

        <!-- Nickname -->
        <div class="mb-3 row">
          <label for="nickname" class="col-sm-4 col-form-label text-end">Nickname:</label>
          <div class="col-sm-8">
            <input type="text" id="nombre" class="form-control form-control-sm" readonly value="atorres" />
          </div>
        </div>


        <!-- Nombre -->
        <div class="mb-3 row">
          <label for="nombre" class="col-sm-4 col-form-label text-end">Nombre:</label>
          <div class="col-sm-8">
            <input type="text" id="nombre" class="form-control form-control-sm" readonly value="Ana Torres" />
          </div>
        </div>

        <!-- Correo -->
        <div class="mb-3 row">
          <label for="correo" class="col-sm-4 col-form-label text-end">Correo:</label>
          <div class="col-sm-8">
            <input type="text" id="correo" class="form-control form-control-sm" readonly value="atorres@gmail.com" />
          </div>
        </div>

        <!-- Panel dinámico: Asistente u Organizador -->
        <div id="panelAsistenteOrganizador">
          <!-- Asistente -->
          <div id="asistenteFields">
            <!-- Apellido -->
            <div class="mb-3 row">
              <label for="apellido" class="col-sm-4 col-form-label text-end">Apellido:</label>
              <div class="col-sm-8">
                <input type="text" id="apellido" class="form-control form-control-sm" readonly value="Torres" />
              </div>
            </div>

            <!-- Institución -->
            <div class="mb-3 row">
              <label for="institucion" class="col-sm-4 col-form-label text-end">Institución:</label>
              <div class="col-sm-8">
                <input type="text" id="institucion" class="form-control form-control-sm" readonly
                  value="Facultad de Ingeniería" />
              </div>
            </div>

            <!-- Fecha de nacimiento -->
            <div class="mb-3 row">
              <label for="nacimiento" class="col-sm-4 col-form-label text-end">Nacimiento:</label>
              <div class="col-sm-8">
                <input type="text" id="nacimiento" class="form-control form-control-sm" readonly value="12/05/1990" />
              </div>
            </div>

            <div class="mb-3 row">
              <label for="registros" class="col-sm-4 col-form-label text-end">Registros:</label>
              <div class="col-sm-8 d-flex flex-column gap-2">
                <label class="col-sm-4 col-form-label text-nowrap">Maratón de
                  Montevideo 2024</label>
                <label class="col-sm-4 col-form-label text-nowrap">Web Summit
                  2026</label>
              </div>
            </div>
          </div>

          <!-- Organizador -->
          <div id="organizadorFields" class="d-none">
            <!-- Descripción -->
            <div class="mb-3 row">
              <label for="descripcion" class="col-sm-4 col-form-label text-end">Descripción:</label>
              <div class="col-sm-8">
                <textarea id="descripcion" class="form-control form-control-sm" rows="2" readonly></textarea>
              </div>
            </div>

            <!-- Link -->
            <div class="mb-3 row">
              <label for="link" class="col-sm-4 col-form-label text-end">Link:</label>
              <div class="col-sm-8">
                <input type="text" id="link" class="form-control form-control-sm" readonly />
              </div>
            </div>

            <!-- Ediciones -->
            <div class="mb-3 row">
              <label for="ediciones" class="col-sm-4 col-form-label text-end">Ediciones:</label>
              <div class="col-sm-8">
                <select id="ediciones" class="form-select form-select-sm">
                  <!-- Opciones dinámicas -->
                </select>
              </div>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>

  <footer class="bg-primary text-white d-flex justify-content-between align-items-center p-2 p-sm-3 mt-auto">
    <p class="fw-bold m-0">TPROG 2025</p>
    <p class="m-0">Grupo 24</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- JavaScript básico para cambiar entre campos según tipo de usuario -->
  <script src="../js/ConsultaUsuario.js"></script>
</body>

</html>
